{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: retail
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: retail
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .name }}
          image: {{ $.Values.imageRegistry }}/{{ $.Values.projectName }}-{{ $.Values.owner }}-{{ $.Values.environment }}/{{ .imageName }}:{{ $.Values.imageTag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SERVICE_NAME
              value: {{ .name }}-service
            {{- if eq .name "trip-planner" }}
            - name: AI_PROVIDER
              value: {{ $.Values.aiProvider | quote }}
            - name: GEMINI_MODEL
              value: {{ $.Values.geminiModel | quote }}
            {{- end }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if and (eq .name "trip-planner") $.Values.geminiSecret.name }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.geminiSecret.name | quote }}
                  key: {{ $.Values.geminiSecret.key | quote }}
            {{- end }}
            {{- if and (eq .name "trip-planner") $.Values.cloudflareSecret.name }}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.cloudflareSecret.name | quote }}
                  key: {{ $.Values.cloudflareSecret.apiTokenKey | quote }}
            - name: CLOUDFLARE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.cloudflareSecret.name | quote }}
                  key: {{ $.Values.cloudflareSecret.accountIdKey | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
---
{{- end }}
