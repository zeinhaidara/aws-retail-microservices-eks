name: Terraform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: dev
        options: [dev, test, prod]
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      TF_DIR: terraform/environments/${{ inputs.environment || 'dev' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
      TF_VAR_enable_nat_gateway: ${{ vars.ENABLE_NAT_GATEWAY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Terraform format check
        run: terraform fmt -check -recursive terraform
      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate
      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}-${{ inputs.environment || 'dev' }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: terraform-apply-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    env:
      TF_DIR: terraform/environments/${{ inputs.environment || 'dev' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_environment: ${{ vars.ENVIRONMENT }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
      TF_VAR_enable_nat_gateway: ${{ vars.ENABLE_NAT_GATEWAY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}-${{ inputs.environment || 'dev' }}
          path: ${{ env.TF_DIR }}
      - name: Apply reviewed plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan
