name: Application CI

on:
  pull_request:
    branches: [main, app]
    paths:
      - "services/**"
      - "tests/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app-cd.yml"

  push:
    branches: [main, app]
    paths:
      - "services/**"
      - "tests/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app-cd.yml"

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Stage 1 — Validate configuration"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test email verification
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/retail

  test:
    name: "Stage 2 — Integration smoke test"
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start application
        run: docker compose up --build --detach

      - name: Run smoke tests
        run: pwsh -File tests/smoke.ps1

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    name: "Stage 2 — Scan ${{ matrix.service }} image"
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: product
            context: services/product-service
          - service: inventory
            context: services/inventory-service
          - service: order
            context: services/order-service
          - service: notification
            context: services/notification-service
          - service: trip-planner
            context: services/trip-planner
          - service: storefront
            context: services/storefront

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: local/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: "Stage 2 — CodeQL analysis"
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3

  filesystem-security:
    name: "Stage 2 — Scan source and configuration"
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: "Stage 2 — Dependency review"
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
