name: Application CI/CD

on:
  pull_request:
    branches: [app]

  push:
    branches: [app]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/retail

  test:
    name: Run application smoke test
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: docker compose up --build --detach

      - name: Run smoke tests
        run: pwsh -File tests/smoke.ps1

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    name: Scan ${{ matrix.service }} image
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [product, inventory, order, notification]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/retail-service
          load: true
          tags: local/${{ matrix.service }}:${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3

  filesystem-security:
    name: Scan source and configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  publish:
    name: Publish ${{ matrix.service }} image
    needs: [validate, test, security, codeql, filesystem-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [product, inventory, order, notification]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image-check
        name: Reuse image if this commit is already published
        env:
          REPOSITORY: ${{ vars.PROJECT_NAME }}-${{ vars.OWNER }}-dev/${{ matrix.service }}-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        if: steps.image-check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: services/retail-service
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.PROJECT_NAME }}-${{ vars.OWNER }}-dev/${{ matrix.service }}-service:${{ github.sha }}

  deploy:
    name: Deploy approved dev release
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/app'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: app-deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.PROJECT_NAME }}-${{ vars.OWNER }}-dev" --region "${{ vars.AWS_REGION }}"

      - name: Deploy Helm release
        run: |
          helm upgrade --install retail deploy/helm/retail \
            --namespace retail-dev \
            --create-namespace \
            --set projectName=${{ vars.PROJECT_NAME }}-${{ vars.OWNER }} \
            --set environment=dev \
            --set imageRegistry=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com \
            --set imageTag=${{ github.sha }} \
            --wait --timeout 10m --atomic
