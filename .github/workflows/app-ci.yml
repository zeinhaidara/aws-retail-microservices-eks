name: Application CI

on:
  pull_request:
    branches: [app]
    paths:
      - "services/**"
      - "tests/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app-cd.yml"

  push:
    branches: [app]
    paths:
      - "services/**"
      - "tests/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/app-ci.yml"
      - ".github/workflows/app-cd.yml"

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: read

concurrency:
  group: app-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Stage 1 — Validate configuration"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint deploy/helm/retail

  test:
    name: "Stage 2 — Integration smoke test"
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start application
        run: docker compose up --build --detach

      - name: Run smoke tests
        run: pwsh -File tests/smoke.ps1

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    name: "Stage 2 — Scan ${{ matrix.service }} image"
    needs: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: product
            context: services/product-service
          - service: inventory
            context: services/inventory-service
          - service: order
            context: services/order-service
          - service: notification
            context: services/notification-service
          - service: trip-planner
            context: services/trip-planner
          - service: storefront
            context: services/storefront

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: local/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: "Stage 2 — CodeQL analysis"
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python

      - uses: github/codeql-action/analyze@v3

  filesystem-security:
    name: "Stage 2 — Scan source and configuration"
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan source and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: "Stage 2 — Dependency review"
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
