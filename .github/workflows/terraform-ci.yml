name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format and validate (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap
          - terraform/environments/dev
          - terraform/environments/test
          - terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize without backend
        working-directory: ${{ matrix.root }}
        run: terraform init -backend=false -lockfile=readonly -input=false

      - name: Validate configuration
        working-directory: ${{ matrix.root }}
        run: terraform validate

  security:
    name: Scan Terraform configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Terraform misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  observability:
    name: Validate Fargate monitoring chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Validate chart and scripts
        run: |
          helm lint deploy/helm/observability
          helm template monitoring deploy/helm/observability --namespace retail-dev > /tmp/monitoring.yaml
          bash -n scripts/platform-addons.sh scripts/sync-runtime-secrets.sh
      - name: Check Prometheus configuration
        run: |
          helm template monitoring deploy/helm/observability --namespace retail-dev --show-only templates/config.yaml > /tmp/config.yaml
          python3 -m pip install 'PyYAML>=6,<7'
          python3 -c "import yaml; docs=list(yaml.safe_load_all(open('/tmp/config.yaml'))); open('/tmp/prometheus.yml','w').write(docs[0]['data']['prometheus.yml'])"
          docker run --rm --entrypoint promtool -v /tmp/prometheus.yml:/etc/prometheus/prometheus.yml:ro prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
