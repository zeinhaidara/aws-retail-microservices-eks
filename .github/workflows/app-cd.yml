name: Application CD

on:
  workflow_run:
    workflows: [Application CI]
    types: [completed]
    branches: [app]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  contents: read
  id-token: write

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
  TARGET_ENV: ${{ inputs.environment || 'dev' }}

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [product, inventory, order, notification]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: services/retail-service
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.PROJECT_NAME }}-${{ env.TARGET_ENV }}/${{ matrix.service }}-service:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to EKS
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.PROJECT_NAME }}-${{ env.TARGET_ENV }}" --region "${{ vars.AWS_REGION }}"
      - name: Deploy Helm release
        run: |
          helm upgrade --install retail deploy/helm/retail \
            --namespace retail-${{ env.TARGET_ENV }} \
            --create-namespace \
            --set projectName=${{ vars.PROJECT_NAME }} \
            --set environment=${{ env.TARGET_ENV }} \
            --set imageRegistry=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com \
            --set imageTag=${{ env.IMAGE_TAG }} \
            --wait --timeout 10m
