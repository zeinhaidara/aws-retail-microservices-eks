name: Terraform CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, prod]
        default: dev
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Validate Terraform and publish the exact plan for review.
  plan:
    name: Plan ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      TF_DIR: terraform/environments/${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}

    steps:
      # Check out the repository and require the existing public DNS zone.
      - uses: actions/checkout@v4

      - name: Check shared Route 53 configuration
        env:
          ROUTE53_ZONE_ID: ${{ vars.ROUTE53_ZONE_ID }}
        run: |
          if [[ -z "$ROUTE53_ZONE_ID" ]]; then
            echo "::error::Set ROUTE53_ZONE_ID as a repository variable."
            exit 1
          fi

      # Assume the deployment role through GitHub OIDC.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Install Terraform CLI.
      - uses: hashicorp/setup-terraform@v3

      # Initialize remote state, then check formatting and configuration.
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      # Create and retain the exact plan that the apply job will use.
      - name: Terraform plan
        if: inputs.action != 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform destroy plan
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=tfplan

      - name: Publish plan artifact
        id: plan-artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ inputs.action }}
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

      # Publish a concise link and explain whether this run can change infrastructure.
      - name: Plan review instructions
        run: |
          echo "## Terraform plan ready" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download and review the Terraform plan](${{ steps.plan-artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.action }}" == "apply" || "${{ inputs.action }}" == "destroy" ]]; then
            echo "The apply job waits for approval in the protected ${{ inputs.environment }} Environment and applies this exact saved plan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "This run is plan-only and makes no infrastructure changes." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Wait for environment approval, then apply the reviewed plan and configure add-ons.
  apply:
    name: Apply reviewed ${{ inputs.action }} plan
    needs: plan
    if: github.ref == 'refs/heads/main' && (inputs.action == 'apply' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_DIR: terraform/environments/${{ inputs.environment }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ vars.OWNER }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}

    steps:
      - uses: actions/checkout@v4

      # Require runtime API credentials before creating application secrets.
      - name: Check runtime credentials
        if: inputs.action == 'apply'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/sync-runtime-secrets.sh validate

      # Authenticate to AWS using the GitHub OIDC deployment role.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Install Terraform CLI, initialize remote state, and restore the approved plan.
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Download reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ inputs.action }}
          path: ${{ env.TF_DIR }}

      - name: Install kubectl
        if: inputs.action != 'plan'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0

      - name: Install Helm
        if: inputs.action != 'plan'
        uses: azure/setup-helm@v4

      # Remove cluster add-ons first so Terraform can safely destroy the platform.
      - name: Remove platform add-ons before destroy
        if: inputs.action == 'destroy'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          OWNER: ${{ vars.OWNER }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/platform-addons.sh destroy

      # Apply the reviewed plan, then install add-ons and sync runtime secrets.
      - name: Apply reviewed plan
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -lock-timeout=5m -auto-approve tfplan

      - name: Install platform add-ons
        if: inputs.action == 'apply'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          OWNER: ${{ vars.OWNER }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/platform-addons.sh install

      - name: Sync runtime credentials
        if: inputs.action == 'apply'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          OWNER: ${{ vars.OWNER }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/sync-runtime-secrets.sh sync
