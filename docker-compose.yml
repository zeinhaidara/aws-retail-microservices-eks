services:
  product-service:
    build:
      context: services/retail-service
    image: retail/product-service:dev
    environment:
      SERVICE_NAME: product-service
    ports:
      - "8081:8080"

  inventory-service:
    build:
      context: services/retail-service
    image: retail/inventory-service:dev
    environment:
      SERVICE_NAME: inventory-service
    ports:
      - "8082:8080"

  order-service:
    build:
      context: services/retail-service
    image: retail/order-service:dev
    environment:
      SERVICE_NAME: order-service
      PRODUCT_SERVICE_URL: http://product-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
    ports:
      - "8083:8080"

  notification-service:
    build:
      context: services/retail-service
    image: retail/notification-service:dev
    environment:
      SERVICE_NAME: notification-service
    ports:
      - "8084:8080"
